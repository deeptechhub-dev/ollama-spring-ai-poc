spring:
  application:
    name: ollama-spring-ai-poc
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:0.6b
      embedding:
        options:
          model: nomic-embed-text
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  datasource:
    url: jdbc:h2:file:./data/chatmemory
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true